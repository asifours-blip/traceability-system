name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-me
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: back-me/pom.xml
      - name: Offline unit tests
        run: mvn -B test
        env:
          # 不读密钥、不连链、不连 IPFS / MySQL
          MYSQL_PASSWORD: ""
          WEBASE_FRONT_URL: "http://127.0.0.1:9/WeBASE-Front"
          CONTRACT_ADDRESS: "0x0"
          CONTRACT_OWNER: "0x0"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-me
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 16
        uses: actions/setup-node@v4
        with:
          node-version: "16"
          cache: npm
          cache-dependency-path: front-me/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
