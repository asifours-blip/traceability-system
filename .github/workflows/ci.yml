name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-me
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: back-me/pom.xml
      - name: Offline unit tests
        run: mvn -B test
        env:
          # 不读密钥、不连链、不连 IPFS / MySQL
          MYSQL_PASSWORD: ""
          WEBASE_FRONT_URL: "http://127.0.0.1:9/WeBASE-Front"
          CONTRACT_ADDRESS: "0x0"
          CONTRACT_OWNER: "0x0"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-me
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 16
        uses: actions/setup-node@v4
        with:
          node-version: "16"
          cache: npm
          cache-dependency-path: front-me/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install
        run: npm ci
      # 编译器来自 npm 包 solc@0.4.25，Hardhat 只作进程内 EVM，不连 FISCO 链、不联网下载编译器
      - name: Compile and test
        run: npm test
        env:
          HARDHAT_DISABLE_TELEMETRY_PROMPT: "true"
      # 提交的 abi/Trace.json 必须与源码编译结果一致
      - name: Check committed ABI is up to date
        run: |
          npm run abi
          git diff --exit-code -- abi/Trace.json
