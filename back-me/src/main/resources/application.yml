webase-front:
  url: ${WEBASE_FRONT_URL:http://localhost:5002/WeBASE-Front}
  group-id: ${WEBASE_GROUP_ID:1}
  # 连不上即判定交易未发出
  connect-timeout-ms: ${WEBASE_CONNECT_TIMEOUT_MS:3000}
  # 必须大于 WeBASE-Front 的 constant.transMaxWait（默认 30 秒）；超时后交易记为 UNKNOWN，不自动重发
  read-timeout-ms: ${WEBASE_READ_TIMEOUT_MS:40000}

# 本地 kubo 节点的 HTTP RPC（scripts/ipfs/ 启停，离线模式、只监听回环）；启动时不连接
ipfs:
  api-url: ${IPFS_API_URL:http://127.0.0.1:5201}
  connect-timeout-ms: ${IPFS_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${IPFS_READ_TIMEOUT_MS:30000}

# 文件规则与清理策略，见 docs/files.md
file:
  # 单个文件上限（字节），默认 10 MB
  max-bytes: ${FILE_MAX_BYTES:10485760}
  orphan:
    # UPLOADED 超过这么久仍未被确认的交易引用 → ORPHANED 并取消 pin
    ttl-hours: ${FILE_ORPHAN_TTL_HOURS:24}
    cleanup-enabled: ${FILE_ORPHAN_CLEANUP_ENABLED:true}
    cleanup-interval-ms: ${FILE_ORPHAN_CLEANUP_INTERVAL_MS:3600000}
