# 端口
server:
  port: 8010

allow:
  # 免登录路径（Ant 风格，精确匹配）：消费者扫码详情与系统信息；其余接口都要 Bearer token
  paths: /login,/getSystemInfo,/trace/detail/**

# 账号体系：登录 token 有效期；首次启动若没有 ADMIN，则按下列配置创建管理员
# 初始密码只从环境变量 ADMIN_INITIAL_PASSWORD 读取，仓库不内置默认密码，缺失则跳过并打 ERROR 日志
auth:
  token-ttl-hours: ${AUTH_TOKEN_TTL_HOURS:12}
  bootstrap-admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_INITIAL_PASSWORD:}
    address: ${ADMIN_ADDRESS:${contract.owner}}

spring:
  profiles:
    active: local   # 本地真实配置在 application-local.yml（已 gitignore，请自行创建）
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
 # 数据库连接配置（表 iot_sensor_data 存放在 mysql 库中）
 # 敏感信息通过 application-local.yml 或环境变量注入，请勿在此硬编码
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:mysql}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
# 合约部署相关信息（地址/owner 为部署相关，请在 application-local.yml 按实际填写）
