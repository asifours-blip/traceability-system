# 端口
server:
  port: 8010

allow:
  # 免登录路径（Ant 风格，精确匹配）：消费者扫码详情与查询（仅公开字段）、已绑定到溯源号的公开文件、系统信息；其余接口都要 Bearer token
  paths: /login,/getSystemInfo,/trace/detail/*,/trace/search,/trace/*/file/*

# 账号体系：登录 token 有效期；首次启动若没有 ADMIN，则按下列配置创建管理员
# 初始密码只从环境变量 ADMIN_INITIAL_PASSWORD 读取，仓库不内置默认密码，缺失则跳过并打 ERROR 日志
auth:
  token-ttl-hours: ${AUTH_TOKEN_TTL_HOURS:12}
  bootstrap-admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_INITIAL_PASSWORD:}
    address: ${ADMIN_ADDRESS:${contract.owner}}
  rate-limit:
    # 同一账号 + IP 在 window-seconds 内失败达到 max-attempts 次就锁定 lockout-seconds；登录成功清零
    max-attempts: ${AUTH_RATE_LIMIT_MAX_ATTEMPTS:5}
    window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:300}
    lockout-seconds: ${AUTH_RATE_LIMIT_LOCKOUT_SECONDS:60}

spring:
  profiles:
    active: local   # 本地真实配置在 application-local.yml（已 gitignore，请自行创建）
  servlet:
    multipart:
      # 容器层上限略大于业务上限 file.max-bytes，超出的在解析请求时直接拒绝（413）；业务上限由 UploadPipeline 流式计数判定
      max-file-size: 11MB
      max-request-size: 12MB
      # 0：上传内容一律先写临时文件，不在内存里缓存整个文件
      file-size-threshold: 0
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
 # 数据库连接配置（表 iot_sensor_data 存放在 mysql 库中）
 # 敏感信息通过 application-local.yml 或环境变量注入，请勿在此硬编码
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:mysql}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
